[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-red-teaming"
version = "0.1.0"
description = "Automated red-teaming harness for LLM safety evaluation — YAML attack library, dual-layer classification, risk reporting"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "plotly>=5.20.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
redteam = "redteam.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/redteam --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam"]
